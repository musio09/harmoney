name: Deploy menu to GitHub Pages

# Publishes the static site (customer menu + admin dashboard) to GitHub Pages.
# No build step — the repo is served as-is.
#
# One-time enable: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Warn if Supabase config is still a placeholder
        run: |
          if grep -q "YOUR_SUPABASE_URL_HERE" js/config.js; then
            echo "::warning file=js/config.js::Supabase config still contains placeholders — the live menu will show a setup notice. See SETUP.md."
          fi

      - name: Fail if a service_role key was committed
        run: |
          if grep -rIn --exclude-dir=.git --exclude-dir=dev \
               -E "service_role[\"']?\s*[:=]|SERVICE_ROLE_KEY\s*[:=]" . ; then
            echo "::error::A service_role key appears to be committed. Remove it and rotate the key in Supabase → Settings → API."
            exit 1
          fi
          echo "No service_role key found."

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
