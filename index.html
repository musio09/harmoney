<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmony Cafe Menu | ሃርመኒ ካፌ ሜኑ</title>
  <meta name="description" content="Harmony Cafe menu — pizza, burgers, fresh juice, coffee and more. ASTU Gate, Adama.">
  <meta name="theme-color" content="#7b1025">
  <link rel="icon" href="harmony-logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #7b1025;
      --primary-dark: #5b0719;
      --secondary: #087443;
      --secondary-light: #0a9b58;
      --gold: #b28a42;
      --gold-light: #d4b06a;
      --cream: #fbfaf6;
      --soft: #f4f1e9;
      --white: #ffffff;
      --text: #1e1e1e;
      --muted: #6b6b6b;
      --border: #e6e0d4;
      --shadow: 0 4px 20px rgba(0,0,0,.06);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Sans Ethiopic", "Segoe UI", Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #9a1a32 100%);
      color: var(--white);
      padding: 30px 20px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(123,16,37,.25);
    }

    header h1 {
      font-size: clamp(26px, 5vw, 38px);
      font-weight: 800;
      letter-spacing: 1px;
    }

    header p {
      font-size: 13px;
      opacity: .85;
      margin-top: 4px;
    }

    .header-contact {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
      flex-wrap: wrap;
    }

    .header-contact a {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 600;
    }

    .header-contact a:hover {
      color: var(--white);
    }

    /* ── NAV TABS ── */
    .nav-tabs {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      position: sticky;
      top: 0;
      z-index: 99;
      scrollbar-width: none;
      min-height: 51px;
    }

    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex-shrink: 0;
      padding: 8px 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--white);
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }

    .nav-tab:hover {
      border-color: var(--secondary);
      color: var(--secondary);
    }

    .nav-tab.active {
      background: var(--secondary);
      border-color: var(--secondary);
      color: var(--white);
    }

    /* ── MAIN ── */
    main {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    /* ── SECTION ── */
    .menu-section {
      display: none;
    }

    .menu-section.active {
      display: block;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title span {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── MENU ITEMS ── */
    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all .2s;
      cursor: default;
    }

    .menu-item:hover {
      border-color: #d0c8b8;
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }

    .item-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      background: var(--soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      overflow: hidden;
    }

    /* Photo uploaded from the admin dashboard replaces the emoji circle */
    .item-icon.has-img { background: var(--soft); }
    .item-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Category-based icon bg colors (kept as fallback; DB value wins) */
    .menu-item[data-cat="pizza"] .item-icon { background: #fff3e0; }
    .menu-item[data-cat="burger"] .item-icon { background: #fce4ec; }
    .menu-item[data-cat="juice"] .item-icon { background: #e8f5e9; }
    .menu-item[data-cat="coffee"] .item-icon { background: #efebe9; }
    .menu-item[data-cat="breakfast"] .item-icon { background: #fff8e1; }
    .menu-item[data-cat="main"] .item-icon { background: #f3e5f5; }
    .menu-item[data-cat="fastfood"] .item-icon { background: #e3f2fd; }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .item-name small {
      font-weight: 500;
      font-size: 12px;
      color: var(--muted);
    }

    .item-price {
      font-weight: 800;
      color: var(--secondary);
      white-space: nowrap;
      font-size: 15px;
    }

    .item-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── SOLD OUT ── */
    .menu-item.sold-out {
      opacity: .55;
      background: var(--soft);
    }

    .menu-item.sold-out .item-price {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      margin-left: 6px;
      text-transform: uppercase;
    }

    .badge.new {
      background: var(--secondary);
      color: var(--white);
    }

    .badge.hot {
      background: #ff6b35;
      color: var(--white);
    }

    .badge.sold {
      background: #9e9e9e;
      color: var(--white);
    }

    /* ── STATUS / LOADING ── */
    .menu-status {
      max-width: 820px;
      margin: 16px auto 0;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      text-align: center;
      background: var(--soft);
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .menu-status.warn { background: #fff8e1; color: #8a6d1a; border-color: #f0e2b6; }
    .menu-status.error { background: #fdecea; color: #a12d21; border-color: #f5c6c0; }

    .menu-empty {
      text-align: center;
      color: var(--muted);
      padding: 40px 16px;
      font-size: 14px;
    }

    .skeleton-item {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .skeleton-dot, .skeleton-line {
      background: linear-gradient(90deg, #eee 25%, #f6f6f6 50%, #eee 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
      border-radius: 6px;
    }

    .skeleton-dot { width: 44px; height: 44px; min-width: 44px; border-radius: 50%; }
    .skeleton-line { height: 12px; flex: 1; }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .skeleton-dot, .skeleton-line { animation: none; }
      html { scroll-behavior: auto; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 20px 16px 16px; }
      main { padding: 16px 12px 40px; }
      .menu-item { padding: 12px 14px; }
      .item-icon { width: 38px; height: 38px; min-width: 38px; font-size: 17px; }
      .item-name { font-size: 14px; }
      .item-price { font-size: 14px; }
      .nav-tabs { padding: 8px 12px; }
      .nav-tab { padding: 6px 14px; font-size: 12px; }
      .section-title { font-size: 19px; }
    }
  </style>
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header>
    <h1 id="cafeName">🍽 HARMONY CAFE</h1>
    <p id="cafeTagline">ሃርመኒ ካፌ • Good Food • Good Coffee • Good Vibes</p>
    <div class="header-contact">
      <span id="cafeAddress">📍 ASTU Gate, Adama</span>
      <a id="cafePhone" href="tel:+251911903172">📞 +251 911 90 31 72</a>
    </div>
  </header>

  <!-- ═══ CATEGORY TABS (rendered from the database) ═══ -->
  <nav class="nav-tabs" id="categoryTabs"></nav>

  <!-- ═══ STATUS BANNER ═══ -->
  <div class="menu-status" id="menuStatus" hidden></div>

  <!-- ═══ MAIN CONTENT (rendered from the database) ═══ -->
  <main id="menuRoot">
    <!-- loading skeleton, replaced on first paint -->
    <div class="skeleton-item"><div class="skeleton-dot"></div><div class="skeleton-line"></div></div>
    <div class="skeleton-item"><div class="skeleton-dot"></div><div class="skeleton-line"></div></div>
    <div class="skeleton-item"><div class="skeleton-dot"></div><div class="skeleton-line"></div></div>
  </main>

  <!-- ═══ FOOTER ═══ -->
  <footer>
    <p><span id="cafeFooter">Harmony Cafe &copy; 2026</span> — <a href="tel:+251911903172">Call us</a></p>
  </footer>

  <style>
    footer {
      text-align: center;
      padding: 20px 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    footer a { color: var(--secondary); text-decoration: none; font-weight: 600; }
  </style>

  <!-- ═══ SCRIPTS ═══ -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/supabase-client.js" defer></script>
  <script src="js/menu.js" defer></script>
</body>
</html>
